services:
  - type: web
    name: adelson-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://inmobiliariafront.joaquinr-val.workers.dev,http://localhost:5173,http://127.0.0.1:5173"
